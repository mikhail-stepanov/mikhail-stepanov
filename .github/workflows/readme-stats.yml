name: Update README cards

on:
  schedule:
    # каждый день в 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:  # запуск вручную из вкладки Actions
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&title_color=0969da&text_color=1f2328&bg_color=ffffff&exclude_repo=together-admin,together-mobile,uocns-web
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: update README cards"
          git push
